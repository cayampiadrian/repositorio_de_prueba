<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="contacto.css">
</head>

<body>

    <header class="text-center py-5 shadow mb-4">

        <div class="container">

            <h1 class="display-5 fw-bold">
                Contacto NBA Fans
            </h1>

            <img src="img/nba.jpg"
                 alt="NBA logo"
                 width="200"
                 class="img-fluid rounded-4 shadow imagen-nba">

            <nav class="d-flex justify-content-center gap-3 flex-wrap mt-4">

                <a href="index.html" class="btn btn-warning fw-bold">
                    Inicio
                </a>

                <a href="info.html" class="btn btn-warning fw-bold">
                    Información
                </a>

                <a href="contacto.html" class="btn btn-warning fw-bold">
                    Contacto
                </a>

            </nav>

        </div>

    </header>

    <main class="container">

        <form method="POST"
              action=""
              class="bg-white rounded-4 shadow-lg p-4 mb-4">

            <fieldset>

                <legend>
                    Datos personales
                </legend>

                <label for="nombre">
                    Nombre:
                </label>

                <input type="text"
                       id="nombre"
                       name="nombre">

                <br><br>

                <label for="email">
                    Email:
                </label>

                <input type="email"
                       id="email"
                       name="email">

                <br><br>

                <label for="pass">
                    Contraseña:
                </label>

                <input type="password"
                       id="pass"
                       name="pass">

            </fieldset>

            <fieldset>

                <legend>
                    Preferencias
                </legend>

                <p>Equipo favorito:</p>

                <input type="radio"
                       id="lakers"
                       name="equipo">

                <label for="lakers">
                    Lakers
                </label>

                <input type="radio"
                       id="otro"
                       name="equipo">

                <label for="otro">
                    Otro
                </label>

                <p class="mt-3">
                    Intereses:
                </p>

                <input type="checkbox"
                       id="noticias">

                <label for="noticias">
                    Noticias
                </label>

                <input type="checkbox"
                       id="estadisticas">

                <label for="estadisticas">
                    Estadísticas
                </label>

            </fieldset>

            <fieldset>

                <legend>
                    Mensaje
                </legend>

                <label for="mensaje">
                    Comentario:
                </label>

                <br>

                <textarea id="mensaje"></textarea>

                <br><br>

                <label for="jugador">
                    Jugador favorito:
                </label>

                <select id="jugador">

                    <option>
                        Luka Dončić
                    </option>

                    <option>
                        LeBron James
                    </option>

                    <option>
                        Otro
                    </option>

                </select>

            </fieldset>

            <div class="mt-4 d-flex gap-3 flex-wrap">

                <input type="submit" value="Enviar">

                <input type="reset" value="Resetear">

            </div>

        </form>

    </main>

    <footer class="text-center py-4 mt-4">

        <p class="mb-0">
            &copy; Facundo Verdu & Facundo Cayampi
        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
